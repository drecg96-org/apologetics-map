name: Harvest source candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1,4"

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    name: Discover and index sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run sources:harvest

      - name: Open source-harvest PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content/sources/harvested)" ]; then
            echo "No new source candidates."
            exit 0
          fi

          branch="automation/source-harvest-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/sources/harvested
          git commit -m "Harvest source candidates"
          git push origin "$branch"
          gh pr create             --base main             --head "$branch"             --title "Harvest source candidates"             --body "Automated metadata-only source discovery. These records are indexed but intentionally unsummarized and unintegrated; review them in the Source Library / Integration Queue."
