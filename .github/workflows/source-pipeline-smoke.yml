name: Source pipeline smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/harvest-sources.ts"
      - "scripts/source-packet.ts"
      - "config/source-harvest.yml"
      - "src/schema.ts"
      - "content/sources/**"
      - ".github/workflows/source-pipeline-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Harvest and agent handoff smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund

      - name: Generate agent integration packet
        run: npm run sources:packet -- sep-moral-arguments-god > /tmp/source-packet.json

      - name: Exercise live discovery without writing files
        run: npm run sources:harvest -- --dry-run
