name: Harvest five passes

on:
  push:
    branches:
      - automation/harvest-five-pass

permissions:
  contents: write

jobs:
  harvest:
    if: ${{ !contains(github.event.head_commit.message, '[harvest-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/harvest-five-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Run five sequential harvest passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "=== harvest pass $i ==="
            npm run sources:harvest
            if [ -n "$(git status --porcelain content/sources/harvested)" ]; then
              git add content/sources/harvested
              git commit -m "[harvest-output] source harvest pass $i"
            else
              echo "No new source candidates on pass $i."
            fi
          done
          git push origin HEAD:automation/harvest-five-pass
